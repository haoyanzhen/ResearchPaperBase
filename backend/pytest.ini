[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: 单元测试（无外部依赖）
    integration: 集成测试（需要真实数据库和 HTTP 客户端）
    contract: 契约测试（schemathesis OpenAPI fuzz）
    e2e: 端到端测试（Playwright）

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
