# Alembic configuration — Research Paper Base
# 参考：https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# migration 脚本目录
script_location = alembic

# 版本文件命名规则：<rev>_<slug>
file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# prepend_sys_path 使项目根目录可导入 app 包
prepend_sys_path = .

# DATABASE_URL 由 env.py 从 app.core.config.settings 中读取，此处留空
sqlalchemy.url =

[post_write_hooks]
# 可选：自动格式化生成的 migration 文件
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
