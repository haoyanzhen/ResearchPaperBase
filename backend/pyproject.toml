[project]
name = "research-paper-base"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3,<4", "alembic>=1,<2"]
[project.scripts]
rpb-api = "rpb.bootstrap.api:main"
rpb-worker = "rpb.bootstrap.worker:main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rpb"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.14"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
